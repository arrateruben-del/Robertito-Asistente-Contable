# Vhost nginx para el backend de Robertito.
# Público: https://robertito-bot-ruben.abacusai.cloud  ->  server_name robertito-bot-ruben.vm.internal
# Symlinkeado a /etc/nginx/conf.d/robertito-bot-ruben.conf

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name robertito-bot-ruben.vm.internal;

    # Revalidación en el navegador; caché de borde corta.
    add_header Cache-Control "max-age=0, s-maxage=60";

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Reenviar el header de secret token de Telegram al backend.
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300;
    }
}
