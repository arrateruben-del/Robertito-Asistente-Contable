<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="Elegí qué gestión querés realizar con Robertito, tu asistente contable.">
  <title>Robertito · Asistente contable</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #14233b;
      --muted: #61718a;
      --paper: #f4f7fb;
      --white: #fff;
      --line: #e2eaf3;
      --blue: #3274e8;
      --blue-soft: #eaf2ff;
      --teal: #128b83;
      --teal-soft: #e5f7f4;
      --shadow: 0 16px 40px rgba(26, 48, 81, .09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 10% 8%, rgba(50,116,232,.12), transparent 34%),
        radial-gradient(ellipse at 92% 88%, rgba(18,139,131,.11), transparent 32%),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 520px); }
    .panel {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 7vw, 44px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      background: rgba(255,255,255,.91);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .avatar {
      display: grid; place-items: center; width: 58px; height: 58px; flex: 0 0 auto;
      border-radius: 19px; color: white; font-size: 28px;
      background: linear-gradient(145deg, #3274e8, #27a7a0);
      box-shadow: 0 9px 20px rgba(50,116,232,.25);
    }
    .brand-name { margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -.02em; }
    .brand-sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    h1 { margin: 0; font-size: clamp(27px, 7vw, 36px); line-height: 1.12; letter-spacing: -.045em; }
    .intro { margin: 12px 0 28px; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .actions { display: grid; gap: 14px; }
    .action {
      width: 100%; min-height: 92px; display: flex; align-items: center; gap: 16px;
      padding: 17px 18px; text-align: left; color: var(--ink); cursor: pointer;
      border: 1px solid var(--line); border-radius: 21px; background: var(--white);
      box-shadow: 0 5px 14px rgba(26,48,81,.035);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      font: inherit;
    }
    .action:hover, .action:focus-visible { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(26,48,81,.10); outline: none; }
    .action:focus-visible { border-color: var(--blue); }
    .action.clients:hover { border-color: #b8d0ff; }
    .action.study:hover { border-color: #a9e1d9; }
    .icon {
      display: grid; place-items: center; width: 52px; height: 52px; flex: 0 0 auto;
      border-radius: 17px; font-size: 23px;
    }
    .clients .icon { background: var(--blue-soft); }
    .study .icon { background: var(--teal-soft); }
    .copy { display: grid; gap: 5px; }
    .label { font-size: 18px; font-weight: 720; letter-spacing: -.02em; }
    .detail { color: var(--muted); font-size: 14px; line-height: 1.35; }
    .foot { margin: 24px 0 0; text-align: center; color: #8592a5; font-size: 13px; }
    .notice {
      display: none; margin-top: 18px; padding: 12px 14px; border-radius: 14px;
      color: #7a4e00; background: #fff4d8; font-size: 14px; line-height: 1.45;
    }
    .notice.show { display: block; }
    @media (max-width: 380px) { body { padding-inline: 14px; } .panel { padding: 25px 20px; border-radius: 25px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="title">
      <div class="brand">
        <div class="avatar" aria-hidden="true">🤖</div>
        <div>
          <p class="brand-name">Robertito</p>
          <p class="brand-sub">Tu asistente contable</p>
        </div>
      </div>
      <h1 id="title">¿Qué necesitás hacer?</h1>
      <p class="intro">Elegí una opción para continuar en el chat de Telegram.</p>
      <div class="actions">
        <button class="action clients" type="button" data-action="clientes">
          <span class="icon" aria-hidden="true">🧾</span>
          <span class="copy"><span class="label">Clientes</span><span class="detail">Calcular una retención de Ganancias</span></span>
        </button>
        <button class="action study" type="button" data-action="estudio">
          <span class="icon" aria-hidden="true">📊</span>
          <span class="copy"><span class="label">Estudio</span><span class="detail">Solicitar el archivo mensual para SICORE</span></span>
        </button>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <p class="foot">Acceso disponible para chats habilitados.</p>
    </section>
  </main>
  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      const botUsername = 'Elrobertbot';
      const notice = document.getElementById('notice');
      const params = new URLSearchParams(window.location.search);
      const topicIds = {
        clientes: String(params.get('clientes') || '').trim(),
        estudio: String(params.get('estudio') || '').trim(),
      };
      const showNotice = message => {
        notice.textContent = message;
        notice.classList.add('show');
      };
      tg?.ready();
      tg?.expand();
      try {
        tg?.setHeaderColor('#f4f7fb');
        tg?.setBackgroundColor('#f4f7fb');
      } catch (_) {}

      document.querySelectorAll('[data-action]').forEach(button => {
        button.addEventListener('click', () => {
          const choice = button.dataset.action;
          const topicId = topicIds[choice];
          if (!/^\\d+$/.test(topicId)) {
            const label = choice === 'clientes' ? 'Clientes' : 'Estudio';
            const command = choice === 'clientes' ? '/start clientes' : '/start estudio';
            showNotice(`Todavía no está registrado el tema de ${label}. Abrilo en Telegram y escribí ${command} una vez; después volvé a abrir este menú.`);
            return;
          }
          const url = `https://t.me/${botUsername}/${encodeURIComponent(topicId)}`;
          if (tg?.openTelegramLink) {
            tg.openTelegramLink(url);
            window.setTimeout(() => tg.close(), 150);
          } else {
            window.location.assign(url);
          }
        });
      });
    })();
  </script>

</html>
